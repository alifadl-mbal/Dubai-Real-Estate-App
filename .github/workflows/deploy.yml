name: Build and deploy

# Rebuilds the whole site from fresh Dubai Land Department data every day and publishes it as
# static files: free on GitHub Pages, and optionally on Cloudflare Pages too.
on:
  schedule:
    - cron: "30 2 * * *" # 06:30 Dubai, after data.dubai's nightly export
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "src/**", "reference/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked

      # ~6.5 GB of CSV (sales, Ejari leases, projects). No login or key needed.
      - name: Download DLD open data
        run: uv run dre fetch transactions rent_contracts projects developers areas
      - name: Build the transactions dataset
        run: uv run dre import-history
      - name: Add days newer than the bulk export from the live API
        # The DLD gateway may refuse non-UAE traffic; the bulk export alone is only a day behind.
        run: uv run dre update || echo "::warning::DLD API unreachable, using the bulk export only"
      - name: Build the rents table
        run: |
          uv run dre rents
          rm -rf data/raw/rent_contracts
      - name: Export site data
        run: uv run dre site

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub Pages
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

      # Optional: also publish to Cloudflare Pages (unlimited bandwidth, global CDN).
      # Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to turn it on.
      - name: Build and deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf out .next
          npm run build
          npx --yes wrangler@4 pages deploy out --project-name skyline-dubai --branch main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
