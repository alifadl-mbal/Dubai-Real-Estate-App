name: Build and deploy

# Builds the static site from the data committed in web/public/data and publishes it: free on
# GitHub Pages, and optionally on Cloudflare Pages too.
#
# The data itself is refreshed on a UAE machine (`uv run dre ...`, see README), because
# data.dubai refuses downloads from GitHub's runners. Pushing the refreshed data redeploys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

      # Optional: also publish to Cloudflare Pages (unlimited bandwidth, global CDN).
      # Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to turn it on.
      - name: Build and deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf out .next
          npm run build
          npx --yes wrangler@4 pages deploy out --project-name skyline-dubai --branch main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
