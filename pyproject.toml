[project]
name = "dubai-real-estate"
version = "2.0.0"
description = "Data pipeline for Skyline, a Dubai property analytics site built on Dubai Land Department open data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.3",
    "pyarrow>=21",
    "shapely>=2.2.0",
    "tenacity>=9.1",
]

[project.scripts]
dre = "dubai_re.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubai_re"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
